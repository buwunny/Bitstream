[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/buwunny/Bitstream"

[workspace.dependencies]
bitstream-manifest = { path = "crates/manifest" }
bitstream-boards = { path = "crates/boards" }
bitstream-rules = { path = "crates/rules" }
bitstream-constraints = { path = "crates/constraints" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
