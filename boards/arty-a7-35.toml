todo = [
  "The master XDC has no DDR3L pins, so bank 34 (1.35 V) carries no signals here. LiteX's digilent_arty.py lists them.",
  "The master XDC covers Rev. D and Rev. E boards; bank voltages come from the Rev E.0 schematic only.",
  "vaux12_p/ck_a6 (B7), vaux12_n/ck_a7 (B6), vaux13_p/ck_a8 (E6), vaux13_n/ck_a9 (E5), vaux14_p/ck_a10 (A4) and vaux14_n/ck_a11 (A3) are alternative names for the same pins (analog or digital use, per the XDC). Both names are kept, as in the XDC. They must not be used together.",
]

