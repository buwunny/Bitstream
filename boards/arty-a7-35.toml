# Aliases:
# - LD4..LD7, BTN0..BTN3, SW0..SW3 and RESET (the red button on CK_RST) are the
#   labels in the reference manual's Basic I/O figure. The figure gives each
#   label's FPGA pin, and every one matches the pin of the XDC port that carries
#   the alias. The RGB LEDs LD0..LD3 have three signals each, so they get no alias.
# - JA1..JD10 are the Pmod connector pins from the reference manual's Pmod pin
#   table (connector and pin number to FPGA pin), matched by FPGA pin.

